name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que necesita el job de deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy activo a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build (Astro)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup, install, build & upload artifact
        uses: withastro/action@v3
        with:
          node-version: 22
          # package-manager: npm  (auto-detectado)

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
