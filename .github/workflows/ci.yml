name: CI

# El deploy lo hace Netlify al detectar un push en main. Este workflow no
# publica nada: solo verifica que lo que entra a main compile y tipe bien.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `astro build` NO comprueba tipos. Sin este paso, un error de TypeScript
      # llega a producción con el CI en verde.
      - name: Comprobar tipos
        run: npm run check

      - name: Build
        run: npm run build
