# Configuración Netlify para CuatroNodos (Astro)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # Netlify da por secreta TODA variable de entorno y falla el build si encuentra
  # su valor en un archivo del repo. Con CHAT_PROVIDER eso es un falso positivo
  # garantizado: su valor es literalmente la palabra `groq` o `anthropic`, que
  # aparece en el README y en docs/chat.md porque documentarla es justamente el
  # punto — se puso ahí para que nadie tenga que adivinar a qué proveedor se está
  # llamando.
  #
  # Se excluye SOLO esa clave, no las rutas. Excluir README.md y docs/chat.md
  # dejaría de vigilarlos para todo lo demás, incluida GROQ_API_KEY, que sí es un
  # secreto de verdad y tiene que seguir saltando si alguien la pega en un
  # archivo.
  SECRETS_SCAN_OMIT_KEYS = "CHAT_PROVIDER"

# ---------- FUNCIONES ----------
# El chat vive en netlify/functions/chat.mts y se publica en /api/chat (la ruta
# se declara con `export const config` dentro de la propia función).
#
# Variables de entorno a configurar en el panel de Netlify — NUNCA en el repo:
#   ANTHROPIC_API_KEY  clave de Claude (si está, tiene prioridad)
#   GROQ_API_KEY       clave de Groq (alternativa más barata)
#   CHAT_PROVIDER      opcional, 'groq' o 'anthropic' para fijar cuál se usa
#   CHAT_MODEL         opcional, para fijar el modelo
#   CHAT_MAX_PER_DAY   opcional, techo diario de mensajes (300 por defecto)
#
# Sin ninguna clave el endpoint sigue respondiendo: deriva a WhatsApp en vez de
# fallar. Las claves solo existen en el servidor; el navegador nunca las ve.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- HEADERS ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Assets de Astro con hash: cache inmutable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: no cachear agresivamente para poder desplegar cambios al instante
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
